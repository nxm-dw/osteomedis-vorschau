<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Osteomedis — Entwurf wählen</title>
<meta name="robots" content="noindex,nofollow">
<style>
  html{color-scheme:dark}
  body{margin:0;min-height:100svh;display:grid;place-items:center;gap:2rem;
    background:#08131C;color:#EDF4F8;
    font:400 16px/1.5 Inter,system-ui,-apple-system,sans-serif;text-align:center;padding:2rem}
  h1{margin:0;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:600;letter-spacing:-.03em}
  p{margin:0;color:#9AAAB6;max-width:40ch}
  .wahl{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
  a{display:block;padding:1.1rem 2.4rem;border:1px solid #47A4C6;color:#08131C;
    background:#47A4C6;text-decoration:none;font-weight:600;letter-spacing:.06em}
  a+a{background:none;color:#47A4C6}
</style>
</head>
<body>
<h1>Drei Entwürfe für Osteomedis</h1>
<p>Dieselben Inhalte, drei eigenständige Gestaltungen. Wähle einen — die Wahl
   wird für den nächsten Besuch gemerkt.</p>
<div class="wahl">
  <a href="/osteomedis-vorschau/a/" data-ent="a">Entwurf A</a>
  <a href="/osteomedis-vorschau/b/" data-ent="b">Entwurf B</a>
  <a href="/osteomedis-vorschau/c/" data-ent="c">Entwurf C</a>
</div>
<script>
(function(){
  var w = null;
  try { w = localStorage.getItem("osteomedis-entwurf"); } catch(e){}
  if (w === "a" || w === "b" || w === "c") location.replace("/osteomedis-vorschau/" + w + "/");
  Array.prototype.forEach.call(document.querySelectorAll("[data-ent]"), function(el){
    el.addEventListener("click", function(){
      try { localStorage.setItem("osteomedis-entwurf", el.dataset.ent); } catch(e){}
    });
  });
})();
</script>
</body>
</html>
